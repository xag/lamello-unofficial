[project]
name = "lamello-unofficial"
version = "0.1.0"
description = "Lamello's connectors and the tools that cut their seats, as data on furniture-design's kinds. Unofficial: not written or endorsed by Lamello."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["quern", "furniture-design"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamello_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "testplan"]

[tool.uv.sources]
testplan = { git = "https://github.com/xag/testplan", rev = "9913bbb00f3de6bc89d9360f8a2be722bf56e8a7" }
# Pinned by full rev, always, and to the same quern as furniture-design: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "61d58cce1709a1573098f49232c25748f229d374" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure. testplan runs the tests whose code, data or packages
# changed since they passed, last failures first then the fastest, under a time budget, and
# keeps every run's times; `pytest --all` runs them all, once a day.
addopts = "-x"
