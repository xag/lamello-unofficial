[project]
name = "lamello-unofficial"
version = "0.1.0"
description = "Lamello's connectors and the tools that cut their seats, as data on furniture-design's kinds. Unofficial: not written or endorsed by Lamello."
requires-python = ">=3.11"
dependencies = ["quern", "furniture-design"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamello_unofficial"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-testmon>=2.1"]

[tool.uv.sources]
# Pinned by full rev, always, and to the same quern as furniture-design: uv accepts one URL
# per distribution across a resolution.
quern = { git = "https://github.com/xag/quern", rev = "c839190abc5e70ce0e693f14e7895e655907263c" }
furniture-design = { git = "https://github.com/xag/furniture-design", rev = "7bddc27122b602c4e8651f076f55c8853cca1727" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure, run last time's failures first.
# First pass `pytest --testmon` (failed and changed tests), then the whole suite with `pytest`.
addopts = "-x --ff"
